<html>
 	<head>
		<title> HTML LISTS</title>

	</head>	
	<body>
<!-- Ordered List -->
###ordered list###

		<ol type="1" start="5" >
			<li>HTML</li>
			<li>CSS</li>
			<li>JS</li>
		</ol>	
<!-- Unordered List -->
###unordered list###
		<ul style="list-style-type:circle">
			<li>HTML</li>
			<li>CSS</li>
			<li>JS</li>
		</ul>
<!-- description list -->
###description list###
<dl>
	<dt>HTML</dt>
	<dd>Hyper Text Markup Language</dd>
</dl>
<!-- Nested list-->
###nested list###
	<ul style="list-style-type:none">
		<li>Frontend
			<ol>
				<li>HTML</li>
				<li>CSS</li>
				<li>JS</li>
			</ol>
		</li>
		<li>Backend
			<ol>
				<li>HTML</li>
			</ol>
</li>
	</body>
</html>
