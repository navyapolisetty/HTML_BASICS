<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body bgcolor="caramel">
    <h1> Registration Form</h1>
    <form action="#" method="post">
        <fieldset>
            <legend>Personal Information</legend>
        <label>Student Name</label>
        
        <input type="text" placeholder="Enter your Name" name="sname" required><br><br>
        <label>Email</label>
        <input type="email" placeholder="Enter email" ><br><br>
        <label>Password</label>
        <input type="password" placeholder="Enter password" required>
       
        <br><br>
        
        <label>Age</label>
        <input type="number" placeholder="Enter age" min="17" max="50"><br><br>
        <label>Gender</label>
        <input type="radio" value="Male"> Male
        <input type="radio" value="Female"> Female
        <br><br>
         </fieldset>
        <label>Skills</label>
         <input type="checkbox" name="skills" value="HTML"> HTML 
        <input type="checkbox" name="skills" value="CSS"> CSS 
        <input type="checkbox" name="skills" value="JavaScript"> JavaScript
         <br><br> 
        <label>Department:</label> 
        <select name="department"> 
            <option value="">Select Department</option> 
            <option value="CSE">CSE</option> 
            <option value="ECE">ECE</option> 
            <option value="IT">IT</option> 
            <option value="EEE">EEE</option> 
        </select> 
 
        <br><br> 
<label>Select a Course:</label> 
 
    <input list="courses" name="course"> 
 
    <datalist id="courses"> 
        <option value="CSE"> 
        <option value="ECE"> 
        <option value="IT"> 
        <option value="EEE"> 
    </datalist> 
<br><br> 
        <label>Date of Birth:</label> 
        <input type="date" name="dob"> 
 
        <br><br> 
 
        <label>Address:</label> 
        <textarea name="address" rows="4" cols="30" 
                  placeholder="Enter your address"></textarea> 
 
        <br><br> 
 
       

    </form>
    
</body>
</html>
